<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세금탈출 (Tax Escape) | 맞춤형 세무 체크리스트</title>
    <meta name="description" content="AI 없이 정확하게! 맞춤형 결정 트리 기반 세무 가이드 및 체크리스트">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header style="text-align: left; margin-bottom: 4rem; animation: fadeInDown 0.8s ease;">
            <p style="color: var(--text-secondary); font-size: 1.2rem; margin-bottom: 0.5rem; font-weight: 300;">제가 만약 세무사라면,</p>
            <h1 class="logo" style="font-size: 3rem; margin: 0; background: none; -webkit-text-fill-color: white;">세금탈출</h1>
        </header>

        <main>
            <!-- Premium Widget: Tax Calendar -->
            <div id="calendar-widget" class="glass-card" style="margin-bottom: 2rem; padding: 1.5rem; display: flex; align-items: center; gap: 1.5rem; border-left: 4px solid var(--accent-color);">
                <div style="font-size: 2rem;">🗓️</div>
                <div>
                    <h3 style="font-size: 1rem;">이달의 세무 일정</h3>
                    <p id="calendar-text" style="color: var(--text-secondary); font-size: 0.9rem;">종합소득세 신고 기간 (5월 1일 ~ 5월 31일)</p>
                </div>
                <div style="margin-left: auto; font-weight: 700; color: var(--accent-color);">D-29</div>
            </div>

            <!-- Search Section -->
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="키워드로 검색 (예: 프리랜서, 5월, 공제)...">
            </div>

            <!-- MBTI / Decision Tree Section -->
            <div id="mbti-section" class="glass-card">
                <div id="mbti-container">
                    <!-- Questions will be injected here -->
                </div>
            </div>

            <!-- Explorer Section -->
            <div id="explorer-section" class="glass-card" style="margin-top: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.25rem;">📂 세무 가이드 보관함</h2>
                    <div id="breadcrumb" style="font-size: 0.8rem; color: var(--text-secondary);">root /</div>
                </div>
                <div id="folder-explorer" class="folder-explorer">
                    <!-- Folders will be injected here -->
                </div>
            </div>
        </main>

        <footer style="text-align: center; margin-top: 4rem; color: var(--text-secondary); font-size: 0.8rem;">
            <p>&copy; 2026 Tax Escape. All rights reserved.</p>
            <p>데이터 출처: 국세청 홈택스 공식 가이드 기반</p>
        </footer>
    </div>

    <!-- Detail Overlay -->
    <div id="detail-overlay">
        <div class="glass-card detail-card">
            <span class="close-btn">&times;</span>
            <div id="detail-content">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
